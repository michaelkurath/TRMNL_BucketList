name: TRMNLP Complete QA

on:
  push:
    paths:
      - .github/workflows/trmnlp-complete-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint with TRMNLP
        run: |
          printf '%s\n' '---' 'watch: false' 'custom_fields: {}' 'transform_runtime: disabled' > .trmnlp.yml
          docker run --rm --pull always --volume "$PWD:/plugin" trmnl/trmnlp lint

      - name: Run semantic and visual tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          views=(full half_horizontal half_vertical quadrant)

          write_config() {
            local mode="$1"
            local completed="$2"
            local items="$3"
            {
              echo "---"
              echo "watch: false"
              echo "custom_fields:"
              echo "  list_title: QA Bucket"
              echo "  display_mode: $mode"
              echo "  show_completed: $completed"
              echo "  max_items: 7"
              echo "  bucket_items: |"
              while IFS= read -r line; do printf '    %s\n' "$line"; done <<< "$items"
              echo "time_zone: Europe/Zurich"
              echo "transform_runtime: disabled"
            } > .trmnlp.yml
          }

          start_preview() {
            docker run --rm --detach --name trmnlp-preview               --publish 4567:4567               --volume "$PWD:/plugin"               trmnl/trmnlp serve --bind 0.0.0.0
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:4567/data >/dev/null; then return 0; fi
              sleep 1
            done
            docker logs trmnlp-preview
            return 1
          }

          stop_preview() {
            docker stop trmnlp-preview >/dev/null 2>&1 || true
          }
          trap stop_preview EXIT

          mixed_items='[x] Done One | Test | Complete
          [x] Done Two | Test | Complete
          [x] Done Three | Test | Complete
          [x] Done Four | Test | Complete
          [ ] Open Five | Test | Pending'

          write_config list true "$mixed_items"
          start_preview
          for view in "${views[@]}"; do
            curl --fail --silent "http://127.0.0.1:4567/render/${view}.html" -o "qa-artifacts/list-show-${view}.html"
            for name in "Done One" "Done Two" "Done Three" "Done Four" "Open Five"; do
              grep -q "$name" "qa-artifacts/list-show-${view}.html"
            done
          done
          stop_preview

          write_config list false "$mixed_items"
          start_preview
          for view in "${views[@]}"; do
            curl --fail --silent "http://127.0.0.1:4567/render/${view}.html" -o "qa-artifacts/list-hide-${view}.html"
            grep -q "Open Five" "qa-artifacts/list-hide-${view}.html"
            ! grep -Eq "Done (One|Two|Three|Four)" "qa-artifacts/list-hide-${view}.html"
          done
          stop_preview

          write_config focus false "$mixed_items"
          start_preview
          for view in "${views[@]}"; do
            curl --fail --silent "http://127.0.0.1:4567/render/${view}.html" -o "qa-artifacts/focus-hide-${view}.html"
            grep -q "Open Five" "qa-artifacts/focus-hide-${view}.html"
            ! grep -Eq "Done (One|Two|Three|Four)" "qa-artifacts/focus-hide-${view}.html"
          done
          stop_preview

          write_config focus true "$mixed_items"
          start_preview
          for view in "${views[@]}"; do
            seen_done=0
            for attempt in $(seq 1 40); do
              curl --fail --silent "http://127.0.0.1:4567/render/${view}.html" -o "qa-artifacts/focus-show-${view}-${attempt}.html"
              if grep -Eq "Done (One|Two|Three|Four)" "qa-artifacts/focus-show-${view}-${attempt}.html"; then
                seen_done=1
                break
              fi
            done
            test "$seen_done" -eq 1
          done

          devices=(
            "og|800|480|1|screen screen--og screen--md screen--density-1x screen--1bit"
            "x|1872|1404|4|screen screen--v2 screen--lg screen--density-2x screen--4bit"
          )
          for spec in "${devices[@]}"; do
            IFS='|' read -r device width height depth classes <<< "$spec"
            for view in "${views[@]}"; do
              curl --fail --silent --get                 --data-urlencode "screen_classes=$classes"                 --data-urlencode "width=$width"                 --data-urlencode "height=$height"                 --data-urlencode "color_depth=$depth"                 "http://127.0.0.1:4567/render/${view}.png"                 -o "qa-artifacts/focus-show-${device}-${view}.png"
            done
          done
          stop_preview

          write_config focus false "   "
          start_preview
          for view in "${views[@]}"; do
            curl --fail --silent "http://127.0.0.1:4567/render/${view}.html" -o "qa-artifacts/empty-${view}.html"
            grep -q "Add your first item" "qa-artifacts/empty-${view}.html"
          done
          stop_preview

          all_done='[x] Done One | Test | Complete
          [x] Done Two | Test | Complete'
          write_config focus false "$all_done"
          start_preview
          for view in "${views[@]}"; do
            curl --fail --silent "http://127.0.0.1:4567/render/${view}.html" -o "qa-artifacts/all-done-${view}.html"
            grep -q "All items completed" "qa-artifacts/all-done-${view}.html"
          done
          stop_preview

          write_config list true "$mixed_items"
          start_preview
          for spec in "${devices[@]}"; do
            IFS='|' read -r device width height depth classes <<< "$spec"
            for view in "${views[@]}"; do
              curl --fail --silent --get                 --data-urlencode "screen_classes=$classes"                 --data-urlencode "width=$width"                 --data-urlencode "height=$height"                 --data-urlencode "color_depth=$depth"                 "http://127.0.0.1:4567/render/${view}.png"                 -o "qa-artifacts/list-show-${device}-${view}.png"
            done
          done
          stop_preview

          python3 - <<'PY'
          from pathlib import Path
          import struct
          pngs = list(Path("qa-artifacts").glob("*.png"))
          assert len(pngs) == 16, len(pngs)
          expected = {
              "og": (800, 480),
              "x": (1872, 1404),
          }
          for path in pngs:
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", path
              width, height = struct.unpack(">II", data[16:24])
              device = "x" if "-x-" in path.name else "og"
              assert (width, height) == expected[device], (path, width, height)
              assert len(data) > 1000, (path, len(data))
          print(f"Validated {len(pngs)} PNG renders.")
          PY

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmnlp-complete-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
