name: Bucket List TRMNLP QA
on:
  push:
    paths: ['src/**', 'scripts/trmnlp_qa.py', '.trmnlp.yml', '.github/workflows/readability-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Lint
        run: |
          docker pull trmnl/trmnlp
          docker run --rm -v "$PWD:/plugin" trmnl/trmnlp version
          docker run --rm -v "$PWD:/plugin" trmnl/trmnlp lint
      - name: Render and regression test
        run: python3 scripts/trmnlp_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bucketlist-readability
          path: qa-artifacts/
          retention-days: 30
