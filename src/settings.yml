---
strategy: static
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.1.1
serverless_language: ''
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 322134
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  category: custom,personal
  description: Put the things you keep saying you will do someday on your TRMNL. Focus shows one unfinished idea for the week, so you have time to take a first step. Add an optional next step to give yourself something specific to do, like picking a destination for Saturday or finding a beginner class. Switch to List to see several ideas and optionally show the ones you have finished. Start by typing one idea per line. Categories, notes and completion markers are optional. Bucket List works in full screen, both half-screen layouts and quadrant. It needs no external accounts or services.
  email_address: michael.kurath@gmail.com
  learn_more_url: https://github.com/michaelkurath/TRMNL_BucketList
- keyname: list_title
  name: Title
  field_type: string
  default: Bucket List
  description: Main title shown on the screen.
  optional: true
- keyname: bucket_items
  name: Bucket List Items
  field_type: text
  rows: 20
  description: Type one idea per line. A plain title works. To add more detail, use [ ] Title | Category | Next step. Use [x] to mark an idea complete. Add a next step without a category by leaving the middle part blank.
  default: |
    Host a homemade pizza night | At home | Invite two friends
    Take a train somewhere new | Day trip | Pick a destination for Saturday.
    Make a ceramic bowl | Skills | Find a beginner class
    [x] Watch the sunrise from a hill
  optional: true
- keyname: display_mode
  name: Display Mode
  field_type: select
  options:
  - focus
  - list
  default: focus
  description: Focus shows one unfinished idea each week, plus its optional next step. List shows several ideas.
  optional: true
- keyname: show_completed
  name: Show completed items?
  field_type: boolean
  default: true
  description: Include completed items in List view.
  optional: true
- keyname: max_items
  name: Max list items
  field_type: number
  min: 3
  max: 100
  step: 1
  default: 7
  description: Number of eligible items passed to List mode. Items that do not fit are summarized by the overflow counter.
  optional: true
name: Bucket List
description: One bucket list idea each week
refresh_interval: 15
